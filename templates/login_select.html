<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose Game -- SimulateGP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #0f172a; min-height: 100vh; display: flex; align-items: center; }
    .login-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; }
    .logo-icon { font-size: 3rem; color: #f59e0b; }
    .game-btn:hover { border-color: #f59e0b !important; }
  </style>
</head>
<body>
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="login-card p-5 shadow-lg text-white">
        <div class="text-center">
          <div class="logo-icon mb-3"><i class="bi bi-controller"></i></div>
          <h2 class="fw-bold mb-1">Choose Your Game</h2>
          <p class="text-secondary mb-4">Your login belongs to more than one game — which one are you playing?</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
          {% endfor %}
        {% endwith %}

        <form method="POST">
          <div class="d-grid gap-2">
            {% for team, game in choices %}
            <button type="submit" name="team_id" value="{{ team.id }}"
                    class="btn btn-outline-secondary game-btn text-start text-white p-3">
              <div class="fw-bold">{{ game.name if game else 'SimulateGP' }}
                {% if game and game.join_code %}<code class="text-info small ms-1">{{ game.join_code }}</code>{% endif %}
              </div>
              <div class="text-secondary small">
                {{ team.firm_name }}{% if game %} &middot; {{ game.phase_label }}{% endif %}
              </div>
            </button>
            {% endfor %}
          </div>
        </form>

        <p class="mt-4 text-secondary small text-center mb-0">
          <a href="{{ url_for('login') }}" class="text-warning">&larr; Back to login</a>
        </p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
